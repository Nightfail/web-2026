<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="../assets/style_profile.css">
</head>
<body>
    <div class="page">
        <nav class="sidebar">
            <ul class="sidebar__menu">
                <li class="sidebar__item">
                    <img src="../assets/images/icon_home.png" alt="Лента" width="24" height="24" class="sidebar__icon">
                </li>
                <li class="sidebar__item">
                    <img src="../assets/images/icon_user.png" alt="Профиль" width="24" height="24" class="sidebar__icon sidebar__icon--active">
                </li>
                <li class="sidebar__item">
                    <img src="../assets/images/icon_plus.png" alt="Создать" width="24" height="24" class="sidebar__icon">
                </li>
            </ul>
        </nav>

        <main class="profile">
            <header class="profile__header">
                <img src="../assets/images/profile_avatar.png" alt="Аватар Вани" class="profile__avatar">
                <h1 class="profile__name">Ваня Денисов</h1>
                <p class="profile__bio">Привет! Я системный аналитик в АСМП. :) Тут моя жизнь, только для самых классных!</p>
                <div class="profile__stats">43 поста</div>
            </header>

            <ul class="profile__grid">
                <li class="profile__grid-item"><img src="../assets/images/street_snow.png" alt="Улица"></li>
                <li class="profile__grid-item"><img src="../assets/images/modern_building.png" alt="Здание"></li>
                <li class="profile__grid-item"><img src="../assets/images/chocolate_dessert.png" alt="Десерт"></li>
                <li class="profile__grid-item"><img src="../assets/images/friends_party.png" alt="Вечеринка"></li>
                <li class="profile__grid-item"><img src="../assets/images/coffee_package.png" alt="Кофе"></li>
                <li class="profile__grid-item"><img src="../assets/images/book_page.png" alt="Книга"></li>
                <li class="profile__grid-item"><img src="../assets/images/profile_photo_7.png" alt="Фото 7"></li>
                <li class="profile__grid-item"><img src="../assets/images/profile_photo_8.png" alt="Фото 8"></li>
                <li class="profile__grid-item"><img src="../assets/images/profile_photo_9.png" alt="Фото 9"></li>
            </ul>
        </main>
    </div>
</body>
</html>
