<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента новостей</title>
    <link rel="stylesheet" href="../assets/style_home.css">
</head>
<body>
    <div class="page">
        <nav class="sidebar">
            <ul class="sidebar__menu">
                <li class="sidebar__item">
                    <img src="../assets/images/icon_home.png" alt="Лента" width="24" height="24" class="sidebar__icon sidebar__icon--active">
                </li>
                <li class="sidebar__item">
                    <img src="../assets/images/icon_user.png" alt="Профиль" width="24" height="24" class="sidebar__icon">
                </li>
                <li class="sidebar__item">
                    <img src="../assets/images/icon_plus.png" alt="Создать" width="24" height="24" class="sidebar__icon">
                </li>
            </ul>
        </nav>

        <main class="feed">
            <article class="post">
                <header class="post__header">
                    <img src="../assets/images/profile_avatar.png" alt="Аватар Вани" class="post__avatar">
                    <span class="post__author">Ваня Денисов</span>
                </header>
                <img src="../assets/images/street_snow.png" alt="Зимняя улица" class="post__image">
                <footer class="post__footer">
                    <div class="post__likes">22</div>
                    <p class="post__text">Вы видели сегодня на улице настоящий снег? Вспомнила детство.</p>
                </footer>
            </article>

            <article class="post">
                <header class="post__header">
                    <img src="../assets/images/profile_avatar.png" alt="Аватар Вани" class="post__avatar">
                    <span class="post__author">Ваня Денисов</span>
                </header>
                <img src="../assets/images/bouquet_snow.png" alt="Букет" class="post__image">
                <footer class="post__footer">
                    <div class="post__likes">15</div>
                    <p class="post__text">Получил подарок 🌿</p>
                </footer>
            </article>
        </main>
    </div>
</body>
</html>
